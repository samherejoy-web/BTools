        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

        <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
        
        <!-- Preconnect for Performance -->

        <!-- DNS Prefetch for Performance -->
        <link rel="dns-prefetch" href="//google-analytics.com" />
        <link rel="dns-prefetch" href="//googletagmanager.com" />
        <link rel="dns-prefetch" href="//marketmindai.com" />
        
        <!-- Resource Hints for Better Performance -->
        <link rel="prefetch" href="/api/blogs" />
        <link rel="prefetch" href="/api/tools" />
        <!-- Removed problematic preload for sitemap -->
        
        <!-- Default title - will be overridden by React Helmet -->
        <title>MarketMindAI - Discover the Best Business Tools</title>
        <meta name="description" content="Find, compare, and choose from thousands of business tools. Make informed decisions with AI-powered insights and community reviews from 10,000+ users." />
        
        <!-- Default Open Graph Tags -->
        <meta property="og:title" content="MarketMindAI - Discover the Best Business Tools" />
        <meta property="og:description" content="Find, compare, and choose from thousands of business tools. Make informed decisions with AI-powered insights and community reviews." />
        <meta property="og:type" content="website" />

        <meta property="og:site_name" content="MarketMindAI" />
        <meta property="og:image" content="https://marketmindai.com/api/images/og-default.jpg" />
        
        <!-- Twitter Card Tags -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="MarketMindAI - Discover the Best Business Tools" />
        <meta name="twitter:description" content="Find, compare, and choose from thousands of business tools with AI-powered insights." />
        
        <!-- Structured Data -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "MarketMindAI",
          "description": "Find, compare, and choose from thousands of business tools. Make informed decisions with AI-powered insights and community reviews.",
          "url": "https://marketmindai.com",
          "publisher": {
            "@type": "Organization",
            "name": "MarketMindAI",
            "url": "https://marketmindai.com"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://marketmindai.com/tools?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
        </script>
        
        <!-- Performance Optimization -->
        <script>
            // Critical CSS Loading Performance
            function loadCSS(href, before, media) {
                var doc = window.document;
                var ss = doc.createElement("link");
                var ref;
                if (before) {
                    ref = before;
                } else {
                    var refs = (doc.body || doc.getElementsByTagName("head")[0]).childNodes;
                    ref = refs[refs.length - 1];
                }
                var sheets = doc.styleSheets;
                ss.rel = "stylesheet";
                ss.href = href;
                ss.media = "only x";
                function ready(cb) {
                    if (doc.body) return cb();
                    setTimeout(function () {
                        ready(cb);
                    });
                }
                ready(function () {
                    ref.parentNode.insertBefore(ss, (before ? ref : ref.nextSibling));
                });
                var onloadcssdefined = function (cb) {
                    var resolvedHref = ss.href;
                    var i = sheets.length;
                    while (i--) {
                        if (sheets[i].href === resolvedHref) {
                            return cb();
                        }
                    }
                    setTimeout(function () {
                        onloadcssdefined(cb);
                    });
                };
                function loadCB() {
                    if (ss.addEventListener) {
                        ss.removeEventListener("load", loadCB);
                    }
                    ss.media = media || "all";
                }
                if (ss.addEventListener) {
                    ss.addEventListener("load", loadCB);
                }
                ss.onloadcssdefined = onloadcssdefined;
                onloadcssdefined(loadCB);
                return ss;
            }
        </script>
        
        <!-- Enhanced Service Worker Registration -->
        <script>
            // Register Service Worker for better performance and offline functionality
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js', {
                        scope: '/'
                    })
                    .then(function(registration) {
                        console.log('✅ SW registered successfully:', registration.scope);
                        
                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            console.log('🔄 New SW version available');
                        });
                    })
                    .catch(function(error) {
                        console.log('❌ SW registration failed:', error);
                    });
                    
                    // Listen for SW messages
                    navigator.serviceWorker.addEventListener('message', event => {
                        if (event.data && event.data.type === 'SKIP_WAITING') {
                            window.location.reload();
                        }
                    });
                });
            }
            
            // Performance monitoring
            window.addEventListener('load', function() {
                if ('performance' in window) {
                    setTimeout(function() {
                        const perfData = performance.getEntriesByType('navigation')[0];
                        console.log('🚀 Page load time:', Math.round(perfData.loadEventEnd - perfData.loadEventStart), 'ms');
                    }, 0);
                }
            });
        </script>
        
        <!-- Immediate SEO meta tags applied -->
        <script>
            console.log('🚀 Production SEO meta tags applied immediately');
        </script>
